[logging]
level = "debug"
error_separate = false

[library]
class = "AIX"
model_file = "./train_models/model_a/perfect_cuda.pt"
communication_mode = "pipelined"

[normalization]
class = "MinMax"
input_min = 0.0
input_max = 1.0
output_min = 0.0
output_max = 1.0

[behavior]
class = "Default"

[application]
class = "MLCouplingApplicationTerrainSolver"
