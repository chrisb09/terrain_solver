[logging]
level = "info"
error_separate = false

[library]
class = "Smartsim"
device = "CPU"
model_backend = "TORCH"
model_path = "./train_models/model_a/watercnn_split_cpu.pt"
model_name = "watercnn"
nodes = 4
host = ""
port = -1
num_gpus = 0
first_gpu = 0
batch_size = 0
min_batch_size = 0
min_batch_timeout = 0

[behavior]
class = "Default"

[application]
class = "MLCouplingApplicationTerrainSolver"
model_io_layout = "split_3x3"
